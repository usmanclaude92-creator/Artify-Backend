# Drives social publishing on a schedule. Vercel's own cron here runs once a day and the in-process scheduler only
# runs while a serverless instance is warm, so due posts would otherwise publish late. This calls the CRON_SECRET-
# protected tick (POST /api/v1/social/internal/publish-tick). It is gated server-side by the kill switch and
# dry-run settings exactly like any other publish path.
# Needs the repo secret CRON_SECRET (same value as the Vercel env var). Optional repo variable APP_URL.
# GitHub only runs scheduled workflows from the default branch, and the minimum interval is 5 minutes.
name: social-publish-tick
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: social-publish-tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call publish tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://cc.artifysols.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET repo secret not set; skipping."; exit 0; fi
          curl --fail-with-body -sS -m 60 -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/v1/social/internal/publish-tick"
